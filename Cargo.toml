[package]
name = "spmc-ring"
version = "0.1.0"
edition = "2024"

[dependencies]
loom = { version = "0.7", optional = true }

[dev-dependencies]
clap = { version = "4.6.4", features = ["derive"] }
crossterm = "0.29.0"
proptest = "1"
ratatui = "0.30.2"
thread-priority = "3.1.1"

[features]
# Enables the *very* long stress runs (millions of iterations). Off by default
# so `cargo test` stays fast; turn on with `--features heavy-stress`.
default = []
heavy-stress = []
loom = ["dep:loom"]
test-hooks = []
bench = []

# Keep loom's search space sane: loom builds are their own thing.
[profile.release]
opt-level = 3

[profile.test]
opt-level = 2
